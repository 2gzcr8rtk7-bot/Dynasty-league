# LOGHI NBA: scarica una volta le copie dei loghi delle squadre NBA dentro il repository (loghi/nba/),
# così l'app non dipende dal sito NBA. Parte da sola quando si toglie/aggiorna questo file o lo script, oppure a mano.
name: loghi-nba
on:
  push:
    branches: [coda, main]
    paths: [.github/workflows/loghi-nba.yml, tools/scarica_loghi_nba.mjs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loghi-nba-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  loghi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica i loghi
        run: node tools/scarica_loghi_nba.mjs
      - name: Salva nel repository
        run: |
          git config user.name "loghi-bot"
          git config user.email "loghi-bot@users.noreply.github.com"
          git add loghi/nba
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Loghi NBA salvati nel repository [automatico]"
          for i in 1 2 3; do git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0; sleep 5; done
          exit 1
