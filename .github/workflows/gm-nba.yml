# (1143) ASSISTENTE GM (area segreta Ducks): ogni giorno GitHub scarica contratti NBA (Basketball Reference), free agent e cap (Spotrac),
# ruoli e notizie delle squadre (ESPN) e aggiorna gm-nba.js. Nessun costo Claude.
name: gm-nba
on:
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gm-nba
  cancel-in-progress: false
jobs:
  gm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica contratti, cap, ruoli e notizie
        run: |
          git config user.name "gm-bot"
          git config user.email "gm-bot@users.noreply.github.com"
          node tools/gm_nba.mjs
          if [ -z "$(git status --porcelain -- gm-nba.js)" ]; then echo "Nessuna novità"; exit 0; fi
          git add gm-nba.js
          git commit -m "Assistente GM: contratti e notizie NBA [automatico]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
